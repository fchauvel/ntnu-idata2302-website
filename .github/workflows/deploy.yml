on:
  workflow_dispatch: 
  push:
    branches:
    - main
  create:
    tags:
      "*"
    
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-22.04
    steps:
    - run: |
        sudo apt-get install sshpass -y
    - uses: actions/checkout@v3
      with:
          fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
          python-version: '3.13'
    - name: Install Deps
      run: |
        pip install -r requirements.txt
    - name: Build
      run: |
        make clean html
    - name: Check that the tagged commit belongs to main
      id: guard
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "deployable=true" >> "${GITHUB_OUTPUT}"
        else
          echo "::warning::Tag ${GITHUB_REF_NAME} is not on main: skipping deployment"
        fi
    - name: Deploy
      env:
         SCP_USERNAME: ${{ secrets.USERNAME }}
         SCP_PASSWORD: ${{ secrets.PASSWORD }}
      if: steps.guard.outputs.deployable == 'true'
      run: |
        sshpass -p ${SCP_PASSWORD} rsync -e "ssh -o StrictHostKeyChecking=no" --delete -avz build/html/ ${SCP_USERNAME}:public_html/idata2302/2026
      
