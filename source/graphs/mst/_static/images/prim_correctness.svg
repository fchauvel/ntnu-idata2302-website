<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="570" height="345" viewBox="0 0 570 345">
<rect width="570" height="345" fill="white"/>
<ellipse cx="150" cy="150" rx="122" ry="115" fill="#e8f0fd" stroke="#222222" stroke-width="2"/><ellipse cx="410" cy="150" rx="122" ry="115" fill="#f3f3f3" stroke="#222222" stroke-width="2"/><text x="150" y="72" font-size="20" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >the tree so far</text><text x="410" y="72" font-size="20" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >the other vertices</text><line x1="280" y1="15" x2="280" y2="285" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 6"/><path d="M 140 215 Q 60 160 130 110" fill="none" stroke="#222222" stroke-width="3"/><line x1="130" y1="110" x2="430" y2="110" stroke="#c0392b" stroke-width="4"/><path d="M 430 110 Q 510 160 430 215" fill="none" stroke="#222222" stroke-width="3"/><line x1="140" y1="215" x2="430" y2="215" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/><rect x="144.4" y="226" width="281.2" height="20" rx="4" fill="white" fill-opacity="0.9"/><text x="285" y="240" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f6feb" font-family="Helvetica, Arial, sans-serif" >(u, v): cheapest edge leaving the tree</text><rect x="181.39999999999998" y="86" width="207.20000000000002" height="20" rx="4" fill="white" fill-opacity="0.9"/><text x="285" y="100" font-size="15" text-anchor="middle" font-weight="normal" fill="#c0392b" font-family="Helvetica, Arial, sans-serif" >(x, y): also leaves the tree</text><circle cx="140" cy="215" r="17" fill="white" stroke="#222222" stroke-width="2"/><text x="140" y="221" font-size="17" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >u</text><circle cx="130" cy="110" r="17" fill="white" stroke="#222222" stroke-width="2"/><text x="130" y="116" font-size="17" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >x</text><circle cx="430" cy="110" r="17" fill="white" stroke="#222222" stroke-width="2"/><text x="430" y="116" font-size="17" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >y</text><circle cx="430" cy="215" r="17" fill="white" stroke="#222222" stroke-width="2"/><text x="430" y="221" font-size="17" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >v</text><text x="285" y="312" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222" font-family="Helvetica, Arial, sans-serif" >Black: the path from u to v in a spanning tree that does not use (u, v). Since (u, v)</text><text x="285" y="332" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222" font-family="Helvetica, Arial, sans-serif" >is the cheapest edge leaving the tree so far, swapping (x, y) for (u, v) is no worse.</text>
</svg>
