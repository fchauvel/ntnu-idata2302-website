="200" cy="105" r="12" fill="white" stroke="#222222" stroke-width="2"/><circle cx="410" cy="190" r="17" fill="white" stroke="#222222" stroke-width="2"/><text x="410" y="196" font-size="17" text-anchor="middle" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif" >v</text><circle cx="460" cy="105" r="12" fill="white" stroke="#222222" stroke-width="2"/><circle cx="350" cy="105" r="12" fill="white" stroke="#222222" stroke-width="2"/><text x="285" y="312" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222" font-family="Helvetica, Arial, sans-serif" >Blue: edges already in the forest. Edges are sorted by weight, so no cheaper edge</text><text x="285" y="332" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222" font-family="Helvetica, Arial, sans-serif" >leaves the tree of u: (u, v) is the cheapest edge leaving it.</text>
