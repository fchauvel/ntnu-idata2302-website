<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='700' height='430' viewBox='0 0 700 430'>
<rect width='700' height='430' fill='white'/>
<defs><marker id='ar' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#222222'/></marker><marker id='arg' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#888888'/></marker></defs>
<circle cx='350' cy='190' r='130' fill='#f4f8fe' stroke='#222222' stroke-width='1.6'/>
<ellipse cx='350' cy='190' rx='130' ry='42' fill='none' stroke='#888888' stroke-width='1.2' stroke-dasharray='5,4'/>
<line x1='350' y1='38' x2='350' y2='342' stroke='#222222' stroke-width='1.4'/>
<circle cx='350' cy='190' r='3' fill='#222222'/>
<text x='350' y='30' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>0  (spin up)</text>
<text x='350' y='362' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>1  (spin down)</text>
<line x1='350' y1='190' x2='428' y2='128' stroke='#1f6feb' stroke-width='3' marker-end='url(#ar)'/>
<circle cx='428' cy='128' r='6' fill='#1f6feb'/>
<line x1='428' y1='128' x2='428' y2='220' stroke='#1f6feb' stroke-width='1.2' stroke-dasharray='4,3'/>
<text x='442' y='120' font-size='14' text-anchor='start' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>the qubit</text>
<text x='496' y='194' font-size='13' text-anchor='start' fill='#888888' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>a mix of 0 and 1</text>
<text x='204' y='194' font-size='13' text-anchor='end' fill='#888888' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>the angle gives the weights</text>
<text x='350' y='415' font-size='14' text-anchor='middle' fill='#888888' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>A qubit is a direction in space, like the spin of an electron.</text>
</svg>
