<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='780' height='400' viewBox='0 0 780 400'>
<rect width='780' height='400' fill='white'/>
<defs><marker id='ar' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#222222'/></marker><marker id='arg' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#888888'/></marker></defs>
<defs><marker id='arb' markerWidth='10' markerHeight='8' refX='8' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1f6feb'/></marker></defs>
<line x1='130' y1='87' x2='130' y2='323' stroke='#888888' stroke-width='1.4' stroke-dasharray='6,4'/>
<circle cx='130' cy='205' r='46' fill='#eef3fc' stroke='#222222' stroke-width='1.8'/>
<line x1='103.3' y1='278.3' x2='159.4' y2='124.2' stroke='#1f6feb' stroke-width='3.2' marker-end='url(#arb)'/>
<text x='130' y='40' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>axis nearly up</text>
<text x='130' y='335' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>tilt: 20°</text>
<text x='130' y='360' font-size='15' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>97% counterclockwise</text>
<text x='130' y='380' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>(0), seen from above</text>
<line x1='390' y1='87' x2='390' y2='323' stroke='#888888' stroke-width='1.4' stroke-dasharray='6,4'/>
<circle cx='390' cy='205' r='46' fill='#eef3fc' stroke='#222222' stroke-width='1.8'/>
<line x1='312.0' y1='205.0' x2='476.0' y2='205.0' stroke='#1f6feb' stroke-width='3.2' marker-end='url(#arb)'/>
<text x='390' y='40' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>axis lying flat</text>
<text x='390' y='335' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>tilt: 90°</text>
<text x='390' y='360' font-size='15' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>50% each way</text>
<text x='390' y='380' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>(0 or 1), seen from above</text>
<line x1='650' y1='87' x2='650' y2='323' stroke='#888888' stroke-width='1.4' stroke-dasharray='6,4'/>
<circle cx='650' cy='205' r='46' fill='#eef3fc' stroke='#222222' stroke-width='1.8'/>
<line x1='623.3' y1='131.7' x2='679.4' y2='285.8' stroke='#1f6feb' stroke-width='3.2' marker-end='url(#arb)'/>
<text x='650' y='40' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>axis nearly down</text>
<text x='650' y='335' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>tilt: 160°</text>
<text x='650' y='360' font-size='15' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>97% clockwise</text>
<text x='650' y='380' font-size='13' text-anchor='middle' fill='#555555' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>(1), seen from above</text>
<text x='20' y='70' font-size='13' text-anchor='start' fill='#888888' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>dashed: the reference axis</text>
<text x='20' y='90' font-size='13' text-anchor='start' fill='#1f6feb' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>blue: the axis the ball spins around</text>
</svg>
