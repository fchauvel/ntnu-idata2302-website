<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='780' height='600' viewBox='0 0 780 600'>
<rect width='780' height='600' fill='white'/>
<defs><marker id='ar' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#222222'/></marker><marker id='arg' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#888888'/></marker></defs>
<rect x='150' y='15' width='220' height='46' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='260.0' y='43.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>A new problem</text>
<line x1='260' y1='61' x2='260' y2='85' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<rect x='110' y='85' width='300' height='76' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='260.0' y='108.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>What is the problem?</text>
<text x='260.0' y='128.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>inputs, size, output,</text>
<text x='260.0' y='148.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>how good, how many resources</text>
<line x1='260' y1='161' x2='260' y2='190' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<polygon points='260,190.0 410.0,240 260,290.0 110.0,240' fill='#e8f0fe' stroke='#1f6feb' stroke-width='1.6'/>
<text x='260' y='227' font-size='13' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Is it a known problem?</text>
<text x='260' y='245' font-size='13' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>studied, googled,</text>
<text x='260' y='263' font-size='13' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>or reducible to one</text>
<line x1='410' y1='240' x2='520' y2='240' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='465.0' y='230.0' font-size='13' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>yes</text>
<rect x='520' y='215' width='220' height='50' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='630.0' y='245.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Use the known solution</text>
<line x1='260' y1='290' x2='260' y2='330' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='274.0' y='310.0' font-size='13' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>no</text>
<polygon points='260,330.0 410.0,380 260,430.0 110.0,380' fill='#e8f0fe' stroke='#1f6feb' stroke-width='1.6'/>
<text x='260' y='376' font-size='13' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Does brute force work?</text>
<text x='260' y='394' font-size='13' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>(and is it fast enough)</text>
<line x1='410' y1='380' x2='520' y2='380' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='465.0' y='370.0' font-size='13' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>yes</text>
<rect x='520' y='355' width='220' height='50' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='630.0' y='385.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Do it, and measure</text>
<line x1='260' y1='430' x2='260' y2='470' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='274.0' y='450.0' font-size='13' text-anchor='middle' fill='#1f6feb' font-weight='bold' font-style='normal' font-family='Helvetica, Arial, sans-serif'>no</text>
<rect x='35' y='470' width='450' height='56' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='260.0' y='493.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Apply an idea:</text>
<text x='260.0' y='513.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>divide-and-conquer, greedy, randomize, dynamic programming</text>
<line x1='485' y1='498' x2='520' y2='498' stroke='#222222' stroke-width='1.6' marker-end='url(#ar)'/>
<rect x='520' y='466' width='240' height='64' rx='10' fill='white' stroke='#222222' stroke-width='1.6'/>
<text x='640.0' y='493.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>Works? Where does it</text>
<text x='640.0' y='513.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>struggle? Improve that part</text>
<path d='M640,530 L640,562 L260,562 L260,528' fill='none' stroke='#222222' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#ar)'/>
<text x='450' y='580' font-size='12' text-anchor='middle' fill='#888888' font-weight='normal' font-style='normal' font-family='Helvetica, Arial, sans-serif'>not good enough: another idea, or improve</text>
</svg>
